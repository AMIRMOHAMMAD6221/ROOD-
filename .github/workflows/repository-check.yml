name: Repository check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-project:
    name: Check Godot project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check project structure
        shell: bash
        run: |
          echo "Checking repository contents..."
          if [[ -f project.godot ]]; then
            echo "Godot project file found."
            echo "Project files are present; engine import/export validation is not configured in this check."
          else
            echo "::warning::project.godot was not found. The game source files have not been uploaded yet."
            echo "This run confirms the GitHub Actions workflow is configured, not that the game builds."
          fi
